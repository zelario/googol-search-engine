# Host configuration
gateway.host=25.36.191.97
url_queue.host=25.36.191.97
barrel.hosts=25.36.191.97,25.37.7.110

# Ports configuration
gateway.port=1098
url_queue.port=1099
barrel.ports=1100,1101

# Client configuration
# (Used for timeout and retry when trying to connect to gateway)
client.retries=3
client.backoff=500

# Gateway configuration
# (Used for timeout and retry when trying to connect to a barrel and when making a search)
gateway.retries=5
gateway.backoff=200
gateway.sync.interval=5

# Barrel configuration
# (Used for timeout and retry when inserting into Database)
barrel.retries=3
barrel.backoff=300

# Downloader configuration
# (Used for timeout and retry when trying to connect to a barrel)
downloader.threads=5
downloader.retries=3
downloader.backoff=300
downloader.connection.timeout=10000
downloader.queue.wait=2000

# Debug configuration
debug.enabled=true
